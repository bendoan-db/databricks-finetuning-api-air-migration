# Unity Catalog model version produced by the legacy fine-tuning API.
source:
  catalog: doan
  schema: ft_api_migration
  model: tabformer_fraud_classifier
  version: 2
  # Optional complete model/tokenizer checkpoint. When populated, it takes
  # precedence and training loads these weights from the UC Volume.
  weights_volume_path: /Volumes/doan/ft_api_migration/finetuning_api/tabformer_fraud/model-v2
  # Optional exact system.ai model version used when weights_volume_path is blank.
  # This field is not auto-discovered; when blank, Hugging Face is selected.
  system_ai_model_uri:
  # Required fallback when neither a Volume path nor system.ai URI is selected.
  huggingface_model_id: meta-llama/Meta-Llama-3.1-8B-Instruct
  # Optional Databricks secret reference (<scope>/<key>) for gated HF models.
  huggingface_token_secret: doan/hf_token
  # MLflow workspace experiment written into the generated AIR workload.
  migration_experiment_path: /Users/ben.doan@databricks.com/air-migration
  # When true, choose LoRA or LoRA with FSDP from inspected model-size evidence.
  peft_only: true

# Leave the three target identity fields blank to use the source model name.
# Otherwise, populate catalog, schema, and model. Volume is reserved metadata;
# output/checkpoint paths are customized explicitly during planning.
target:
  catalog:
  schema:
  model:
  volume:

# Resources written into the generated AIR config. Supported accelerator types
# are GPU_1xA10, GPU_1xH100, and GPU_8xH100; counts must match the type.
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100
