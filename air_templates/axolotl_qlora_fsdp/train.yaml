# Llama 3.1 70B Instruct QLoRA with FSDP on Databricks AI Runtime.
#
# Before running, update the Unity Catalog paths and, for remote gated models,
# the HF_TOKEN secret below.
# From this directory, submit with:
#   air run --file train.yaml --watch

experiment_name: llama31_70b_instruct_axolotl_qlora_fsdp

environment:
  version: '5'
  dependencies:
    # Axolotl's Flash Attention extra must be installed without build isolation.
    - --no-build-isolation
    - 'axolotl[flash-attn]==0.13.1'
    - trl==0.27.1
    - torchao==0.16.0
    - 'mlflow>=3.6,<4'
    - 'pyyaml>=6.0'

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

env_variables:
  AXOLOTL_DO_NOT_TRACK: '1'
  HF_MLFLOW_LOG_ARTIFACTS: 'false'
  TOKENIZERS_PARALLELISM: 'false'

# AI Runtime injects this Databricks secret into the workload as HF_TOKEN.
# Remove this block when model_name/tokenizer_path are materialized local paths.
secrets:
  HF_TOKEN: your-secret-scope/hf_token

code_source:
  type: snapshot
  snapshot:
    root_path: .

command: torchrun --nproc_per_node=8 $CODE_SOURCE_PATH/train.py

parameters:
  training_config:
    # Generated migrations set this from migrate/config.yaml. When true,
    # model_name/tokenizer_path must be the materialized configured UC version.
    use_existing_weights: false
    model_source: hugging_face  # existing_uc | system_ai | hugging_face
    source_model_uri:
    model_name: meta-llama/Meta-Llama-3.1-70B-Instruct
    # existing_uc/system_ai sources set these to worker-readable Volume paths.
    tokenizer_path:
    experiment_path: /Shared/llama31_70b_instruct_axolotl_qlora_fsdp
    mlflow_run_name: llama31-70b-instruct-axolotl-qlora-fsdp
    # The runner merges the PEFT adapter into the unquantized base model and
    # registers that full checkpoint here. The catalog/schema must exist.
    registered_model_name: doan.ft_api_migration.llama31_70b_instruct_axolotl_qlora_fsdp

    # JSONL records must have OpenAI-style `messages` arrays. These defaults
    # consume the train/eval files produced by example_setup/02_stage_data.
    train_data_path: /Volumes/doan/ft_api_migration/finetuning_api/tabformer_fraud/train.jsonl
    eval_data_path: /Volumes/doan/ft_api_migration/finetuning_api/tabformer_fraud/eval.jsonl
    output_dir: /Volumes/doan/ft_api_migration/finetuning_api/axolotl_qlora_fsdp/llama31_70b_instruct
    merged_output_dir: /Volumes/doan/ft_api_migration/finetuning_api/axolotl_qlora_fsdp/llama31_70b_instruct_merged

    # QLoRA freezes the 4-bit base model and updates only the LoRA adapters.
    adapter: qlora
    load_in_8bit: false
    load_in_4bit: true

    sequence_len: 2048
    sample_packing: true
    eval_sample_packing: false

    micro_batch_size: 1
    gradient_accumulation_steps: 4
    num_epochs: 1
    learning_rate: 1.0e-5
    optimizer: adamw_torch_fused
    lr_scheduler: cosine
    warmup_ratio: 0.1
    weight_decay: 0.0
    logging_steps: 1
    evals_per_epoch: 1
    saves_per_epoch: 1
    save_total_limit: 2
    save_first_step: false
    save_safetensors: true
    resume_from_checkpoint:

    lora_r: 16
    lora_alpha: 16
    lora_dropout: 0.05
    lora_target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

    gradient_checkpointing: true
    # Axolotl's pinned FSDP-QLoRA recipe uses reentrant checkpointing.
    gradient_checkpointing_use_reentrant: true
    bf16: auto
    tf32: false
    attn_implementation: flash_attention_2
    seed: 42

    # FSDP shards the frozen quantized base model across all eight GPUs. CPU
    # offload favors capacity over throughput and can be disabled if the model
    # and requested sequence length fit comfortably without it.
    fsdp:
      - full_shard
      - auto_wrap
    fsdp_config:
      sync_module_states: true
      offload_params: true
      use_orig_params: false
      cpu_ram_efficient_loading: true
      auto_wrap_policy: TRANSFORMER_BASED_WRAP
      transformer_layer_cls_to_wrap: LlamaDecoderLayer
      state_dict_type: FULL_STATE_DICT
      final_state_dict_type: FULL_STATE_DICT
